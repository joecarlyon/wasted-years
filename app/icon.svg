<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c94c"/>
      <stop offset="1" stop-color="#b07f1a"/>
    </linearGradient>
    <linearGradient id="horn" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="2">
      <stop offset="0" stop-color="#a2ace0"/>
      <stop offset="1" stop-color="#e8e8f2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.58" r="0.5">
      <stop offset="0" stop-color="#d0a52e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#d0a52e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Badge -->
  <rect width="32" height="32" rx="7" fill="#0a0a0f"/>
  <rect width="32" height="32" rx="7" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.3" fill="none" stroke="#d0a52e" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Devil horns, behind the foam -->
  <path d="M11 9.6 C7.2 8.8 5 6.1 5.3 2.1 C6.9 4.7 9 5.9 12.4 6.6 Z" fill="url(#horn)"/>
  <path d="M21 9.6 C24.8 8.8 27 6.1 26.7 2.1 C25.1 4.7 23 5.9 19.6 6.6 Z" fill="url(#horn)"/>

  <!-- Pint -->
  <path d="M8 11 L10.2 27.3 Q10.4 28.6 11.7 28.6 L20.3 28.6 Q21.6 28.6 21.8 27.3 L24 11 Z" fill="url(#beer)"/>
  <path d="M8 11 L10.2 27.3 Q10.4 28.6 11.7 28.6 L20.3 28.6 Q21.6 28.6 21.8 27.3 L24 11" fill="none" stroke="#f3ead3" stroke-opacity="0.45" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M10.4 13.5 L11.9 25.5" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.1" stroke-linecap="round"/>
  <g fill="#f3ead3" fill-opacity="0.7">
    <circle cx="17.5" cy="22.5" r="0.7"/>
    <circle cx="15.2" cy="18.6" r="0.55"/>
    <circle cx="18.6" cy="16.2" r="0.5"/>
  </g>

  <!-- Foam head, dripping over the rim -->
  <g fill="#f3ead3">
    <circle cx="11.3" cy="9.6" r="3.1"/>
    <circle cx="16" cy="8" r="3.7"/>
    <circle cx="20.7" cy="9.6" r="3.1"/>
    <rect x="7.8" y="9.4" width="16.4" height="3.1" rx="1.55"/>
    <path d="M21.6 11.5 h1.7 v2.6 a0.85 0.85 0 0 1 -1.7 0 Z"/>
  </g>
</svg>
